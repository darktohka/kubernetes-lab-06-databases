# Credentials are owned by the database chart, not by the app. The demo chart
# references the same Secret name in the manual and operator variants, so it
# does not need to know which one is installed.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mongodb-manual.fullname" . }}-credentials
  labels:
    {{- include "mongodb-manual.labels" . | nindent 4 }}
type: Opaque
stringData:
  app-password: {{ required "auth.appPassword is required" .Values.auth.appPassword | quote }}
  admin-password: {{ required "auth.adminPassword is required" .Values.auth.adminPassword | quote }}
  exporter-password: {{ required "auth.exporterPassword is required" .Values.auth.exporterPassword | quote }}
  keyfile: {{ required "auth.keyfile is required" .Values.auth.keyfile | quote }}
