# The demo application: a small FastAPI service that reads and writes notes in
# MongoDB. It connects to the individual members of the headless Service the
# operator created, so the driver can discover the primary itself.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-demo
  labels:
    app.kubernetes.io/name: mongodb-demo
    app.kubernetes.io/part-of: lab06-databases
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mongodb-demo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongodb-demo
        app.kubernetes.io/part-of: lab06-databases
    spec:
      containers:
        - name: app
          image: lighthouse.tohka.us/example-projects/lab6-mongo-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            # Seed list of the 3 members: <pod>.<headless-service>:27017.
            - name: MONGO_HOSTS
              value: mongodb-0.mongodb-svc:27017,mongodb-1.mongodb-svc:27017,mongodb-2.mongodb-svc:27017
            - name: MONGO_DB
              value: lab6
            - name: MONGO_USER
              value: app
            - name: MONGO_AUTH_SOURCE
              value: admin
            - name: MONGO_READ_PREFERENCE
              value: secondaryPreferred
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongodb-credentials
                  key: app-password
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
