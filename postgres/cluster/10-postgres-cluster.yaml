# A PostgreSQL cluster managed by CloudNativePG.
#
# The operator watches this object and creates the Pods, the PVCs, and the
# Services that point at the current primary (postgres-rw) or at the read-only
# replicas (postgres-ro). You do not write a StatefulSet.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  username: app
  password: lab6-postgres-password
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  # 3 instances: one primary and two streaming replicas.
  instances: 3

  # The CloudNativePG image already contains the instance manager the operator
  # needs. Pin it so every student runs the same version.
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6

  storage:
    size: 512Mi

  bootstrap:
    initdb:
      database: lab6
      owner: app
      # The operator reads username/password from this Secret and creates the
      # "app" role as the owner of the "lab6" database.
      secret:
        name: postgres-credentials
